name: Test and deploy VTuber Era

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5
  GODOT_RELEASE: 4.5-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install exact Godot and matching Web templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot-install"
          cd "$RUNNER_TEMP/godot-install"
          base="https://github.com/godotengine/godot-builds/releases/download/$GODOT_RELEASE"
          curl -fsSL --retry 3 "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o engine.zip
          curl -fsSL --retry 3 "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o templates.tpz
          curl -fsSL --retry 3 "$base/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          mv engine.zip "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          mv templates.tpz "Godot_v${GODOT_RELEASE}_export_templates.tpz"
          sha512sum --ignore-missing --check SHA512-SUMS.txt
          unzip -q "Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          chmod +x "Godot_v${GODOT_RELEASE}_linux.x86_64"
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          destination = Path.home()/'.local/share/godot/export_templates/4.5.stable'
          destination.mkdir(parents=True, exist_ok=True)
          with ZipFile(f"Godot_v{os.environ['GODOT_RELEASE']}_export_templates.tpz") as archive:
              for entry in archive.namelist():
                  name = Path(entry).name
                  if name in ('web_nothreads_debug.zip', 'web_nothreads_release.zip', 'version.txt'):
                      (destination/name).write_bytes(archive.read(entry))
          PY
          test "$(godot --version)" = "4.5.stable.official.876b29033"
      - name: Import resources
        run: godot --headless --path . --editor --import --quit
      - name: Run deterministic gameplay and UI tests
        timeout-minutes: 15
        run: |
          godot --headless --path . --script res://tests/run_tests.gd
          godot --headless --path . --script res://tests/elemental_tests.gd
          godot --headless --path . --script res://tests/passive_tests.gd
          godot --headless --path . --script res://tests/ninja_tests.gd
          godot --headless --path . --script res://tests/formation_tests.gd
          godot --headless --path . --script res://tests/commander_skill_tests.gd
          godot --headless --path . --script res://tests/ui_smoke.gd
      - name: Export single-threaded Web release
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          python3 tools/prepare_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
